name: Sync fork with upstream

on:
  schedule:
    - cron: '*/10 * * * *'  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream repo
        run: |
          git remote add upstream https://github.com/STEAM-Computer-Science-2025-26/1st-period-isp-tech-to-customer.git

      - name: Fetch upstream
        run: |
          git fetch upstream

      - name: Merge upstream into fork
        run: |
          git checkout main
          git merge upstream/main --no-edit

      - name: Push changes
        run: |
          git push origin main
